<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Login - Email WhatsApp Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:28px; width:min(420px,92vw); box-shadow:0 10px 30px rgba(0,0,0,.35); }
    h1 { margin:0 0 8px; font-size:1.3rem; }
    p.sub { margin:0 0 18px; color:#94a3b8; font-size:.95rem; }
    label { display:block; margin:12px 0 6px; font-size:.9rem; color:#cbd5e1; }
    input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#020617; color:#e2e8f0; }
    button { margin-top:18px; width:100%; padding:10px 12px; border:0; border-radius:8px; background:#2563eb; color:white; font-weight:600; cursor:pointer; }
    .err { background:#7f1d1d; color:#fecaca; padding:10px 12px; border-radius:8px; margin-bottom:12px; }
    .meta { margin-top:14px; color:#64748b; font-size:.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Dashboard</h1>
    <p class="sub">Sign in to view email-response activities.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <label>Username</label>
      <input name="username" autocomplete="username" required />
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
    <div class="meta">DB backend: {{ db_backend }}</div>
  </div>
</body>
</html>
